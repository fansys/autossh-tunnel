name: autotunnel
services:
  autossh:
    image: ghcr.io/fansys/autossh-tunnel:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config:/etc/autossh/config:rw
      # Optional: uncomment if you want to reuse existing host SSH keys directly
      # - ~/.ssh:/home/myuser/.ssh:ro
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      # Web Console Admin Authentication (Default: admin / admin888)
      - USERNAME=admin
      - PASSWORD=admin888
      # Optional: Persistent JWT secret for stateless sessions
      # - JWT_SECRET=your-secure-jwt-secret-string
      # Optional: API Key for programmatic REST API access (Bearer token)
      # - API_KEY=your-secret-api-key
    network_mode: "host"
    restart: always
