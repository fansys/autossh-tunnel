name: Build and Release Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

  build-binaries:
    name: Build Multi-Platform Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            arm_ver: '7'
          - os: linux
            arch: 386
          - os: linux
            arch: riscv64
          # macOS (Darwin)
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          # Windows
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_ver }}
          CGO_ENABLED: '0'
        run: |
          OUTPUT_NAME="autossh-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.arm_ver }}${{ matrix.ext }}"
          echo "Building $OUTPUT_NAME..."
          go build -ldflags="-s -w" -trimpath -o "$OUTPUT_NAME" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autossh-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.arm_ver }}
          path: autossh-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.arm_ver }}${{ matrix.ext }}
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package & Generate Checksums
        run: |
          mkdir -p release_assets
          cd dist
          for dir in */; do
            dir_name="${dir%/}"
            file=$(find "$dir" -maxdepth 1 -type f)
            if [ -f "$file" ]; then
              base=$(basename "$file")
              cp "$file" "../release_assets/$base"
            fi
          done
          cd ../release_assets
          sha256sum * > checksums.txt
          echo "Release assets generated:"
          ls -la

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
