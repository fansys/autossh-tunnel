<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title">SSH Tunnel Manager</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="/static/vendor/fonts/material-icons.css" rel="stylesheet">
    <link href="/static/vendor/fonts/roboto.css" rel="stylesheet">
    <script src="/static/vendor/tailwind.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="/static/i18n.js"></script>
    <script src="/static/theme-switcher.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-200 relative" data-page-title="app.title">
    
    <!-- Top Right Controls (Theme & Language Toggle) -->
    <div class="absolute top-5 right-6 flex items-center gap-2">
        <!-- Language Single-click Toggle -->
        <button id="languageToggle" class="h-10 px-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 shadow-sm hover:border-indigo-500 dark:hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all font-medium" title="切换语言">
            <span class="text-xs font-bold tracking-wider flex items-center gap-1">🇺🇸 EN</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggle" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 shadow-sm hover:border-indigo-500 dark:hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all" title="切换主题">
            <i class="material-icons text-xl">light_mode</i>
        </button>
    </div>

    <!-- Login Card -->
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none p-8 max-w-sm w-full transition-all">
        <div class="text-center mb-7">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl shadow-xl shadow-indigo-500/25 mb-3.5 overflow-hidden">
                <img src="/static/logo.svg" alt="Logo" class="w-full h-full object-contain">
            </div>
            <h1 class="text-xl font-bold text-slate-900 dark:text-white" data-i18n="login.title">SSH Tunnel Manager</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1" data-i18n="login.subtitle">请登录以管理您的 SSH 隧道</p>
        </div>

        <div id="loginError" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs text-center font-medium"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5" data-i18n="login.username">用户名</label>
                <div class="relative flex items-center">
                    <i class="material-icons absolute left-3 text-slate-400 dark:text-slate-500 text-lg pointer-events-none">person</i>
                    <input type="text" id="username" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all" placeholder="admin" required autofocus autocomplete="username">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5" data-i18n="login.password">密码</label>
                <div class="relative flex items-center">
                    <i class="material-icons absolute left-3 text-slate-400 dark:text-slate-500 text-lg pointer-events-none">lock</i>
                    <input type="password" id="password" class="w-full pl-10 pr-10 py-2.5 bg-slate-50 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all" placeholder="••••••••" required autocomplete="current-password">
                    <i class="material-icons absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 text-lg cursor-pointer select-none" id="togglePasswordVisibility">visibility</i>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-2.5 mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-sm font-semibold rounded-xl shadow-md shadow-indigo-500/20 active:scale-[0.98] transition-all" data-i18n="login.button">
                登 录
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400 dark:text-slate-500" data-i18n="login.footer">
            AutoSSH Tunnel Manager
        </div>
    </div>

    <script>
        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePasswordVisibility');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = 'visibility';
            }
        });

        // Handle login submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errDiv = document.getElementById('loginError');
            const submitBtn = document.getElementById('submitBtn');
            errDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = window.i18n ? window.i18n.t('login.logging_in', '登录中...') : '登录中...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get('redirect') || '/';
                    window.location.href = redirect;
                } else {
                    const errMsg = (window.i18n && data.error === 'Invalid username or password') 
                        ? window.i18n.t('login.invalid_credentials', '用户名或密码错误')
                        : (data.error || '用户名或密码错误');
                    errDiv.innerText = errMsg;
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = window.i18n ? window.i18n.t('login.network_error', '网络连接失败，请稍后重试') : '网络连接失败，请稍后重试';
                errDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = window.i18n ? window.i18n.t('login.button', '登 录') : '登 录';
            }
        });
    </script>
</body>
</html>
